// Quake III on the PS2: the settings of the measured runs (high quality:
// lightmaps, dynamic lights, marks, shadows, full curves, the whole HUD),
// then the timedemo, which quits when it is done. Copy it next to the
// paks (baseq3/) and start with +exec q3hq.cfg.
set r_vertexLight 0
set r_dynamiclight 1
set r_fastsky 0
set r_lodbias 0
set r_subdivisions 4
set r_flares 0
set cg_marks 1
set cg_gibs 1
set cg_shadows 1
set com_blood 1
set cg_brassTime 2500
set cg_simpleItems 0
set cg_drawGun 1
set cg_viewsize 100
set cg_fov 90
set cg_drawCrosshair 4
set cg_drawCrosshairNames 1
set cg_draw2D 1
set cg_drawIcons 1
set cg_draw3dIcons 1
set cg_lagometer 0
set cg_drawFPS 0
set r_ps2models 1
set r_ps2colorlight 0
set nextdemo quit
set timedemo 1
demo four
